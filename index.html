<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xaikra AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

<div id="appContainer">
  <header id="appHeader">
    <div class="brand-group">
      <div class="brand-symbol"></div>
      <h1 class="brand-title">Xaikra AI</h1>
    </div>
    
    <div id="connectionIndicator">
      <span id="statusDot"></span>
      <span id="statusText">Initializing</span>
    </div>
  </header>

  <div id="appBody">
    <section id="chatSection">
      <div id="chatBox"></div>

      <div id="composer">
        <textarea id="messageInput" rows="1" placeholder="Chat... "></textarea>
        
        <button id="sendButton" type="button" disabled>
          <span>Send</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>

      <footer id="chatFooter">
        <span>Created by booz</span>
      </footer>
    </section>

    <aside id="companionPanel">
      <div class="panel-scroll">
        <div class="avatar-card">
          <div class="avatar-frame">
            <img id="companionAvatar" src="Images/Basic.png" alt="Xaikra">
            <span class="avatar-status-badge"></span>
          </div>
          <h2 id="companionName">Xaikra</h2>
          <span id="companionSubtext" class="companion-subtext"></span>
        </div>

        <div class="panel-block">
          <div class="block-header">
            <h3 class="header-featured">Emotional State</h3>
          </div>
          <div id="emotionsContainer" class="emotions-list"></div>
        </div>

        <div class="panel-block">
          <div class="block-header">
            <h3>Available Models</h3>
          </div>
          <div class="model-selector-group">
            <label class="model-card-option">
              <input type="radio" name="modelChoice" value="xaikra-2.1" checked>
              <div class="model-card-content">
                <div class="model-card-title">
                  <strong>Xaikra 2.1</strong>
                </div>
                <p>Consistent responses , never forgets , slower</p>
              </div>
            </label>

            <label class="model-card-option">
              <input type="radio" name="modelChoice" value="xaikra-1.3">
              <div class="model-card-content">
                <div class="model-card-title">
                  <strong>Xaikra 1.3</strong>
                </div>
                <p>Faster responses but less consistant and lighter memory</p>
              </div>
            </label>
          </div>
        </div>

        <div class="panel-block block-persona">
          <div class="block-header">
            <h3 class="header-minimal">User Persona</h3>
            <button id="togglePersonaEdit" type="button" class="btn-text">Edit</button>
          </div>

          <div id="personaDisplay" class="persona-display">
            <div class="persona-field">
              <span class="field-label">Name</span>
              <span id="personaNameValue" class="field-value">User</span>
            </div>
            <div class="persona-field">
              <span class="field-label">Gender</span>
              <span id="personaGenderValue" class="field-value">Not specified</span>
            </div>
            <div class="persona-field">
              <span class="field-label">Backstory</span>
              <p id="personaBackstoryValue" class="field-value-block">No backstory provided yet.</p>
            </div>
          </div>

          <form id="personaForm" class="persona-form" hidden>
            <div class="form-group">
              <label for="personaNameInput">Name</label>
              <input type="text" id="personaNameInput" placeholder="Your name">
            </div>
            <div class="form-group">
              <label for="personaGenderInput">Gender</label>
              <input type="text" id="personaGenderInput" placeholder="Your gender">
            </div>
            <div class="form-group">
              <label for="personaBackstoryInput">Backstory</label>
              <textarea id="personaBackstoryInput" rows="3" placeholder="Brief backstory or details..."></textarea>
            </div>
            <div class="form-actions">
              <button id="savePersonaButton" type="button" class="btn-primary">Save Persona</button>
              <button id="cancelPersonaButton" type="button" class="btn-secondary">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </aside>
  </div>
</div>

<script src="config/aiPersonality.js"></script>
<script src="data/userPersona.js"></script>
<script src="data/conversation.js"></script>
<script src="services/emotionService.js"></script>
<script src="services/memoryService.js"></script>
<script src="services/contextBuilder.js"></script>
<script src="services/serverConnector.js"></script>
<script src="services/aiService.js"></script>
<script src="js/companionPanel.js"></script>
<script src="js/chatView.js"></script>
<script src="js/app.js"></script>
</body>
</html>
